<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 OTT 인증번호 센터</title>
    <!-- Tailwind CSS (디자인 프레임워크) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-8">

    <!-- Header -->
    <header class="text-center mb-10 max-w-xl">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 text-xs font-semibold mb-4 border border-emerald-500/20">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            24시간 실시간 감지 중
        </div>
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white mb-2">
            🎬 OTT 인증번호 센터
        </h1>
        <p class="text-slate-400 text-sm sm:text-base">
            수신된 메일의 인증번호가 자동으로 최신화됩니다. 카드를 클릭하면 번호가 복사됩니다.
        </p>
    </header>

    <!-- Grid Container -->
    <main class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 w-full max-w-6xl">

        <!-- 1. Disney+ Card -->
        <div onclick="copyToClipboard('disney')" class="group relative bg-slate-900 border border-slate-800 hover:border-blue-500/50 rounded-2xl p-6 transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-blue-500/10 cursor-pointer">
            <div class="flex items-center justify-between mb-4">
                <span class="text-xs font-bold px-2.5 py-1 rounded-md bg-blue-500/10 text-blue-400 border border-blue-500/20">DISNEY+</span>
                <span id="disney-time" class="text-[11px] text-slate-500">대기 중...</span>
            </div>
            <div class="text-slate-400 text-xs font-medium mb-1">최신 인증번호</div>
            <div id="disney-code" class="text-3xl font-black text-white group-hover:text-blue-400 transition-colors tracking-wider">
                -
            </div>
        </div>

        <!-- 2. Netflix Card -->
        <div onclick="copyToClipboard('netflix')" class="group relative bg-slate-900 border border-slate-800 hover:border-red-500/50 rounded-2xl p-6 transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-red-500/10 cursor-pointer">
            <div class="flex items-center justify-between mb-4">
                <span class="text-xs font-bold px-2.5 py-1 rounded-md bg-red-500/10 text-red-500 border border-red-500/20">NETFLIX</span>
                <span id="netflix-time" class="text-[11px] text-slate-500">대기 중...</span>
            </div>
            <div class="text-slate-400 text-xs font-medium mb-1">최신 인증번호 / 상태</div>
            <div id="netflix-code" class="text-3xl font-black text-white group-hover:text-red-400 transition-colors tracking-wider">
                -
            </div>
        </div>

        <!-- 3. TVING Card -->
        <div onclick="copyToClipboard('tving')" class="group relative bg-slate-900 border border-slate-800 hover:border-rose-500/50 rounded-2xl p-6 transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-rose-500/10 cursor-pointer">
            <div class="flex items-center justify-between mb-4">
                <span class="text-xs font-bold px-2.5 py-1 rounded-md bg-rose-500/10 text-rose-400 border border-rose-500/20">TVING</span>
                <span id="tving-time" class="text-[11px] text-slate-500">대기 중...</span>
            </div>
            <div class="text-slate-400 text-xs font-medium mb-1">최신 인증번호</div>
            <div id="tving-code" class="text-3xl font-black text-white group-hover:text-rose-400 transition-colors tracking-wider">
                -
            </div>
        </div>

        <!-- 4. Coupang Play Card -->
        <div onclick="copyToClipboard('coupang')" class="group relative bg-slate-900 border border-slate-800 hover:border-cyan-500/50 rounded-2xl p-6 transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-cyan-500/10 cursor-pointer">
            <div class="flex items-center justify-between mb-4">
                <span class="text-xs font-bold px-2.5 py-1 rounded-md bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">COUPANG</span>
                <span id="coupang-time" class="text-[11px] text-slate-500">대기 중...</span>
            </div>
            <div class="text-slate-400 text-xs font-medium mb-1">최신 인증번호</div>
            <div id="coupang-code" class="text-3xl font-black text-white group-hover:text-cyan-400 transition-colors tracking-wider">
                -
            </div>
        </div>

    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 bg-emerald-500 text-slate-950 px-4 py-2 rounded-lg font-semibold text-sm opacity-0 transition-opacity duration-300 pointer-events-none shadow-lg">
        인증번호가 클립보드에 복사되었습니다!
    </div>

    <!-- Script Area -->
    <script>
        // Supabase 설정
        const SUPABASE_URL = "https://otsdobyklhmcgcgdwqmb.supabase.co";
        const SUPABASE_KEY = "sb_publishable_yr6NDyOY4-m5AkF-6HqxSA_uMzvf2E7";

        // SDK 클라이언트 생성 (변수명 중복 방지)
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Supabase DB 실시간 조회 함수
        async function fetchOttCodes() {
            try {
                const { data, error } = await supabaseClient
                    .from('ott_codes')
                    .select('*');

                if (error) {
                    console.error("Supabase 조회 에러:", error);
                    return;
                }

                if (data) {
                    data.forEach(item => {
                        const codeElement = document.getElementById(`${item.id}-code`);
                        const timeElement = document.getElementById(`${item.id}-time`);

                        if (codeElement) {
                            codeElement.innerText = item.code || '-';
                        }

                        if (timeElement && item.updated_at) {
                            const date = new Date(item.updated_at);
                            const hours = String(date.getHours()).padStart(2, '0');
                            const minutes = String(date.getMinutes()).padStart(2, '0');
                            const seconds = String(date.getSeconds()).padStart(2, '0');
                            timeElement.innerText = `${hours}:${minutes}:${seconds}`;
                        }
                    });
                }
            } catch (err) {
                console.error("네트워크 오류:", err);
            }
        }

        // 클립보드 복사 함수
        function copyToClipboard(id) {
            const codeText = document.getElementById(`${id}-code`).innerText;
            if (codeText && codeText !== '-' && !codeText.includes('완료')) {
                navigator.clipboard.writeText(codeText).then(() => {
                    showToast();
                });
            }
        }

        // 토스트 알림 표시
        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2000);
        }

        // 최초 로드 실행
        fetchOttCodes();

        // 3초마다 자동 데이터 갱신 (Polling)
        setInterval(fetchOttCodes, 3000);
    </script>
</body>
</html>
